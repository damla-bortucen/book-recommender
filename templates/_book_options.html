{%- for book in matches -%}
<div class="option" data-id="{{ book.hardcover_id }}" data-label="{{ book.title }}">
    <span class="block leading-snug">{{ book.title }}</span>
    {%- if book.authors %}
    <span class="block text-xs text-muted">{{ book.authors | join(", ") }}</span>
    {%- endif %}
</div>
{%- else -%}
    {%- if searched %}
    <p class="px-4 py-3 text-sm text-muted">No title matches “{{ q }}”.</p>
    {%- endif -%}
{%- endfor %}
