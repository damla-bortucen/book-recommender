{% for book in matches %}
    <div class="option cursor-pointer rounded-md px-3 py-2 hover:bg-sky-50"
         data-id="{{ book.hardcover_id }}" data-label="{{ book.title }}">
        {{ book.title }}
        {% if book.authors %}<span class="text-slate-500">— {{ book.authors | join(", ") }}</span>{% endif %}
    </div>
{% endfor %}
