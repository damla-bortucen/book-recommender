{% for book in matches %}
    <div class="option cursor-pointer rounded-md px-3 py-2 hover:bg-blue-50" 
    data-isbn="{{ book.isbn13 }}" data-label="{{ book.title }}">
    {{ book.title }}{% if book.authors is string %} <span class="text-gray-500">— {{ book.authors.replace(";", ", ") }}</span>{% endif %}
    </div>
{% else %}
{% endfor %}
