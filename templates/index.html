<!doctype html>
<html>
  <head>
    <title>{{ title }}</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  </head>
  <body>
    <h1>{{ title }}</h1>
    <h3>{{ tagline }}</h3>

    <p>Searching across {{ book_count }} books.</p>

    <form hx-post="/search" hx-target="#results" hx-swap="innerHTML">
        <input type="text" name="query" placeholder="Describe a book you'd like...">

        <select name="category">
            {% for c in categories %}
            <option value="{{ c }}">{{ c }}</option>
            {% endfor %}
        </select>

        <select name="tone">
            {% for t in tones %}
            <option value="{{ t }}">{{ t }}</option>
            {% endfor %}
        </select>

        <button type="submit">Search</button>
    </form>

    <br>
    <div id="results"></div>

    <hr>
    <h3>Or find books like ones you love</h3>

    <input type="search" id="book-q" name="q" placeholder="Search for a book by title..."
        hx-get="/book-search"
        hx-trigger="keyup changed delay:300ms"
        hx-target="#book-options">
    <div id="book-options"></div>

    <form id="books-form" hx-post="/recommend-from-books" hx-target="#results" hx-swap="innerHTML">
        <div id="chips"></div>
        <button type="submit">Find similar</button>
    </form>


  <script>
    const booksForm = document.getElementById('books-form');
    const chips = document.getElementById('chips');

    document.getElementById('book-options').addEventListener('click', function (e) {
        const opt = e.target.closest('.option');
        if (opt) addPick(opt.dataset.isbn, opt.dataset.label);
    });

    function addPick(isbn, label) {
        const picks = booksForm.querySelectorAll('input[name="picks"]');
        if (picks.length >= 3) return; // max 3
        if (booksForm.querySelector('input[name="picks"][value="' + isbn + '"]')) return; // no dupes

        const hidden = document.createElement('input'); // remembered for submit
        hidden.type = 'hidden';
        hidden.name = 'picks';
        hidden.value = isbn;
        booksForm.appendChild(hidden);

        const chip = document.createElement('span'); // visible to the user
        chip.className = 'chip';
        chip.textContent = label;
        chips.appendChild(chip);
    }
  </script>

  </body>
</html>
