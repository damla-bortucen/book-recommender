<!doctype html>
<html>
  <head>
    <title>{{ title }}</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  </head>
  <body>
    <h1>{{ title }}</h1>
    <h3>{{ tagline }}</h3>

    <p>Searching across {{ book_count }} books.</p>

    <form hx-post="/search" hx-target="#results" hx-swap="innerHTML">
        <input type="text" name="query" placeholder="Describe a book you'd like...">

        <select name="category">
            {% for c in categories %}
            <option value="{{ c }}">{{ c }}</option>
            {% endfor %}
        </select>

        <select name="tone">
            {% for t in tones %}
            <option value="{{ t }}">{{ t }}</option>
            {% endfor %}
        </select>

        <button type="submit">Search</button>
    </form>

    <br>
    <div id="results"></div>

    <hr>
    <h3>Or find books like ones you love</h3>

    <input type="search" name="q" placeholder="Search for a book by title..."
        hx-get="/book-search"
        hx-trigger="keyup changed delay:300ms" 
        hx-target="#book-options">

    <div id="book-options"></div>

  </body>
</html>
