<!doctype html>
<html>
    <head>
        <title>{{ title }}</title>
        <link rel="stylesheet" href="/static/css/tailwind.css">
        <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
        <script src="/static/js/app.js" defer></script> 
        <!--defer waits until the HTML is fully parsed before running script-->
    </head>
    <body>
    <main class="max-w-5xl mx-auto p-6 space-y-4">
        <header class="text-center space-y-2 py-6 bg-sky-200">
            <h1 class="text-4xl font-bold tracking-tight text-gray-900">{{ title }}</h1>
            <p class="text-lg text-gray-750">{{ tagline }}</p>
            <p class="text-md text-gray-600">{{ "{:,}".format(book_count) }} books to explore</p>
        </header>

         <!-- TAB BAR -->
        <div class="flex gap-2 border-b border-gray-200">
            <button type="button" data-tab="search"
                    class="tab-btn px-4 py-2 font-medium border-b-2 border-blue-600 text-blue-600">
                Search by description
            </button>
            <button type="button" data-tab="books"
                    class="tab-btn px-4 py-2 font-medium border-b-2 border-transparent text-gray-500">
                Find by books
            </button>
        </div>

        <!--Tab 1-->
        <div id="panel-search">
            <form hx-post="/search" hx-indicator="#loading" hx-target="#results" hx-swap="innerHTML"
                class="flex flex-wrap items-center gap-3">
                <input type="text" name="query" placeholder="Describe a book you'd like..."
                    class="flex-1 min-w-[12rem] rounded-lg border border-gray-300 px-3 py-2 
                    focus:outline-none focus:ring-2 focus:ring-blue-500">

                <select name="category" class="rounded-lg border border-gray-300 bg-white px-3 py-2">
                    {% for c in categories %}
                    <option value="{{ c }}">{{ c }}</option>
                    {% endfor %}
                </select>

                <select name="tone" class="rounded-lg border border-gray-300 bg-white px-3 py-2">
                    {% for t in tones %}
                    <option value="{{ t }}">{{ t }}</option>
                    {% endfor %}
                </select>

                <button type="submit" class="rounded-lg bg-blue-600 px-4 py-2 text-white hover:bg-blue-700">Search</button>
            </form>
        </div>

        <!---------------------------rec-by-books------------------------->

         <!-- PANEL 2: find by books (starts hidden) -->
        <div id="panel-books" class="hidden space-y-3">
            <h3 class="font-semibold text-lg text-gray-900">Or find books like ones you love</h3>

            <input type="search" id="book-q" name="q" placeholder="Search for a book by title..."
                hx-get="/book-search"
                hx-trigger="keyup changed delay:300ms"
                hx-target="#book-options"
                class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100 disabled:cursor-not-allowed">
            <div id="book-options" class="space-y-1"></div>

            <form id="books-form" hx-post="/recommend-from-books" hx-indicator="#loading" hx-target="#results" hx-swap="innerHTML" class="space-y-3">
                <p id="pick-count" class="text-sm text-gray-500">0 / 3 selected</p>
                <div id="chips" class="flex flex-wrap gap-2"></div>
                <button type="submit" class="rounded-lg bg-blue-600 px-4 py-2 text-white hover:bg-blue-700">Find similar</button>
            </form>
        </div>

        <br>
        <div id="loading" class="htmx-indicator flex items-center gap-2 text-gray-500">
            <span class="inline-block h-4 w-4 animate-spin rounded-full border-2 border-gray-300 border-t-blue-600"></span>
            Searching…
        </div>
        <div id="results" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>

    </main>
    </body>
</html>
